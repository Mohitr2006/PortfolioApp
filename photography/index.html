<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photography | Mohit Raj</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/photography.css">

</head>

<body>

    <header>

        <nav class="navbar">

            <a href="../" class="logo">

                <span class="logo-circle">M</span>

                <h2>Mohit Raj</h2>

            </a>

            <ul class="nav-links">

                <li>
                    <a href="../">Home</a>
                </li>

                <li>
                    <a href="../about/">About</a>
                </li>

                    <a href="../projects/">Projects</a>

                <li>
                    <a href="#">Photography</a>
                </li>

                <li>
                    <a href="../contact/">Contact</a>
                </li>

            </ul>

        </nav>

    </header>

    <main>

        <section class="photography">

            <div class="photo-header hidden">

                <p class="section-tag">
                    PHOTOGRAPHY
                </p>

                <h1>
                    Capturing Moments Through My Lens
                </h1>

                <p>
                    Photography allows me to see beauty in everyday life.
                    Here are some of my favorite moments.
                </p>

            </div>

            <!-- ================= GALLERY ================= -->

            <div class="gallery">

                <div class="photo-card hidden">
                    <img class="gallery-img"
                        src="../images/photo1.png"
                        alt="Flower Photography">
                </div>

                <div class="photo-card hidden">
                    <img class="gallery-img"
                        src="../images/photo2.jpg"
                        alt="Portrait Photography">
                </div>

                <div class="photo-card hidden">
                    <img class="gallery-img"
                        src="../images/photo3.jpg"
                        alt="Street Photography">
                </div>

                <div class="photo-card hidden">
                    <img class="gallery-img"
                        src="../images/photo4.jpg"
                        alt="Festival Photography">
                </div>

                <div class="photo-card hidden">
                    <img class="gallery-img"
                        src="../images/photo5.jpg"
                        alt="Festival Photography">
                </div>

                <div class="photo-card hidden">
                    <img class="gallery-img"
                        src="../images/photo6.jpg"
                        alt="Architecture Photography">
                </div>

                <div class="photo-card hidden">
                    <img class="gallery-img"
                        src="../images/photo7.jpg"
                        alt="Festival Photography">
                </div>

                <div class="photo-card hidden">
                    <img class="gallery-img"
                        src="../images/photo8.jpg"
                        alt="Festival Photography">
                </div>

                <div class="photo-card hidden">
                    <img class="gallery-img"
                        src="../images/photo9.jpg"
                        alt="Architecture Photography">
                </div>

            </div>

        </section>

    </main>

    <!-- ================= LIGHTBOX ================= -->

    <div class="lightbox" id="lightbox">

        <span class="close">&times;</span>

        <img id="lightbox-img" src="" alt="Full Size Image">

    </div>

    <footer>

        <p>
            © 2026 Mohit Raj. All Rights Reserved.
        </p>

    </footer>

    <script src="../js/photography.js"></script>

</html>
